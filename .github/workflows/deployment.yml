name: Docker Build and Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

env:
  IMAGE_NAME: ghcr.io/koenvdheuvel/yahoo-auction-alert-discord-bot

jobs:
  build:
    runs-on: [self-hosted, media]
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=short
            type=sha,format=long
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy:
    runs-on: [self-hosted, media]
    needs: build
    concurrency: deploy
    permissions:
      contents: read
      packages: read
    steps:
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy with docker compose
        working-directory: /docker/other
        run: |
          docker compose pull yahoo_auction_alert
          docker compose up -d yahoo_auction_alert

      - name: Verify deployment
        working-directory: /docker/other
        run: |
          set -euo pipefail
          NAME=yahoo-auction-alert-discord-bot
          expected=$(docker image inspect --format '{{.Id}}' "$IMAGE_NAME:latest")
          actual=$(docker inspect --format '{{.Image}}' "$NAME")
          [ "$expected" = "$actual" ] || { echo "Image mismatch: container=$actual latest=$expected"; exit 1; }
          echo "Waiting 30s to confirm the container stays up"
          sleep 30
          running=$(docker inspect --format '{{.State.Running}}' "$NAME")
          restarts=$(docker inspect --format '{{.RestartCount}}' "$NAME")
          echo "running=$running restarts=$restarts"
          docker logs --tail 20 "$NAME"
          [ "$running" = "true" ] && [ "$restarts" = "0" ]
