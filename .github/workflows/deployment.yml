name: Docker Build and Deploy

# master  -> :latest  -> compose service yahoo_auction_alert     (production bot)
# develop -> :develop -> compose service yahoo_auction_alert_dev (dev bot; its dashboard is at yahoo-dev.waxdt.com and yahoo.internal.waxdt.com)
on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]
  workflow_dispatch:

env:
  IMAGE_NAME: ghcr.io/koenvdheuvel/yahoo-auction-alert-discord-bot

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: python -m pytest -q
      # The dashboard's UI. The Docker build compiles it again; this catches errors before that.
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm run typecheck
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  build:
    runs-on: [self-hosted, media]
    needs: test
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/master' }}
            type=raw,value=develop,enable=${{ github.ref == 'refs/heads/develop' }}
            type=sha,format=short
            type=sha,format=long
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy:
    runs-on: [self-hosted, media]
    needs: build
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/develop'
    concurrency: deploy-${{ github.ref_name }}
    permissions:
      contents: read
      packages: read
    env:
      SERVICE: ${{ github.ref == 'refs/heads/master' && 'yahoo_auction_alert' || 'yahoo_auction_alert_dev' }}
      CONTAINER: ${{ github.ref == 'refs/heads/master' && 'yahoo-auction-alert-discord-bot' || 'yahoo-auction-alert-discord-bot-dev' }}
      TAG: ${{ github.ref == 'refs/heads/master' && 'latest' || 'develop' }}
    steps:
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy with docker compose
        working-directory: /docker/other
        run: |
          docker compose pull "$SERVICE"
          docker compose up -d "$SERVICE"

      - name: Verify deployment
        working-directory: /docker/other
        run: |
          set -euo pipefail
          expected=$(docker image inspect --format '{{.Id}}' "$IMAGE_NAME:$TAG")
          actual=$(docker inspect --format '{{.Image}}' "$CONTAINER")
          [ "$expected" = "$actual" ] || { echo "Image mismatch: container=$actual $TAG=$expected"; exit 1; }
          echo "Waiting 30s to confirm the container stays up"
          sleep 30
          running=$(docker inspect --format '{{.State.Running}}' "$CONTAINER")
          restarts=$(docker inspect --format '{{.RestartCount}}' "$CONTAINER")
          echo "running=$running restarts=$restarts"
          docker logs --tail 20 "$CONTAINER"
          [ "$running" = "true" ] && [ "$restarts" = "0" ]
